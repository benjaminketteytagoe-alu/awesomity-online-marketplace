# Frontend (nginx + React SPA) on Fly.io
#
# nginx serves the built React app on port 80. Requests to /api/* are
# proxied to the backend over Fly's private network using the internal
# hostname marketplace-api-bkt.internal:8080.
#
# Public URL: https://marketplace-web-bkt.fly.dev

app = "marketplace-web-bkt"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = 256
