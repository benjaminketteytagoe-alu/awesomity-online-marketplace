# nginx configuration served as a template.
#
# The nginx image's entrypoint substitutes ${BACKEND_URL} at container
# start via envsubst. This lets the same image run in both Docker
# Compose (BACKEND_URL=http://backend:8080) and Fly
# (BACKEND_URL=http://marketplace-api-bkt.internal:8080) without
# modifications.
#
# See /etc/nginx/templates/ handling in the nginx Docker image docs:
#   https://hub.docker.com/_/nginx (Section: "Using environment variables in nginx configuration")

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---------- Security headers ----------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------- Compression ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ---------- Static caching ----------

    # Hashed bundles from Vite → cache for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Static assets with stable names → cache for 30 days
    location ~* \.(?:ico|png|jpg|jpeg|gif|webp|svg|woff2?|ttf|otf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # ---------- API proxy ----------
    # ${BACKEND_URL} is substituted by envsubst on container start.

    location /api/ {
        proxy_pass ${BACKEND_URL}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /actuator/ {
        proxy_pass ${BACKEND_URL}/actuator/;
        proxy_set_header Host $host;
    }

    # ---------- SPA fallback ----------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
