server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Hashed assets — cache for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Static assets referenced by name (favicon, etc.) — shorter cache
    location ~* \.(?:ico|png|jpg|jpeg|gif|webp|svg|woff2?|ttf|otf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Proxy /api/* to the backend service on the Docker network
    location /api/ {
        proxy_pass http://marketplace-api-bkt.internal:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Proxy /actuator/* too (useful for debug)
    location /actuator/ {
        proxy_pass http://marketplace-api-bkt.internal:8080/actuator/;
        proxy_set_header Host $host;
    }

    # SPA fallback — unknown routes serve the shell so React Router handles them
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
