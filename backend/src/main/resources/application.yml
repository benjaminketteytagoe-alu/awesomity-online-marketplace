spring:
  application:
    name: marketplace-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:marketplace}
    username: ${DB_USER:marketplace}
    password: ${DB_PASSWORD:marketplace}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:marketplace}
    password: ${RABBIT_PASSWORD:marketplace}
    connection-timeout: 10s
    dynamic: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 2s
          multiplier: 2.0
          max-attempts: 3
          max-interval: 30s
        concurrency: 2
        max-concurrency: 8
        prefetch: 10

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  thymeleaf:
    check-template-location: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  mail:
    from: ${MAIL_FROM:no-reply@marketplace.local}
    from-name: Marketplace
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
    token-ttl-minutes: 60

  jwt:
    secret: ${JWT_SECRET}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
    issuer: marketplace

logging:
  level:
    org.flywaydb: INFO
    org.hibernate.SQL: INFO
    org.springframework.amqp: INFO
    org.springframework.mail: DEBUG
    com.marketplace.mail: DEBUG
    com.marketplace.security: DEBUG
