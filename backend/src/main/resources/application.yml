spring:
  application:
    name: marketplace-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:marketplace}
    username: ${DB_USER:marketplace}
    password: ${DB_PASSWORD:marketplace}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:marketplace}
    password: ${RABBIT_PASSWORD:marketplace}
    connection-timeout: 10s
    dynamic: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 2s
          multiplier: 2.0
          max-attempts: 3
          max-interval: 30s
        concurrency: 2
        max-concurrency: 8
        prefetch: 10

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.flywaydb: INFO
    org.hibernate.SQL: INFO
    org.springframework.amqp: INFO
    org.springframework.boot.autoconfigure.amqp: DEBUG
    org.springframework.amqp.rabbit.core.RabbitAdmin: DEBUG
