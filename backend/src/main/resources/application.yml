spring:
  application:
    name: marketplace-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:marketplace}
    username: ${DB_USER:marketplace}
    password: ${DB_PASSWORD:marketplace}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:marketplace}
    password: ${RABBIT_PASSWORD:marketplace}
    connection-timeout: 10s
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 2s
          max-attempts: 5
        missing-queues-fatal: false   
    dynamic: true                     

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    rabbit:
      enabled: true      # report rabbit status in /actuator/health

logging:
  level:
    org.flywaydb: INFO
    org.hibernate.SQL: INFO
    org.springframework.amqp: INFO
